# Render Blueprint - deploys Nirikshan on the free tier.
#
# Render only runs the two Docker web services here (no per-account limit).
# PostgreSQL and Redis come from external free providers so we avoid Render's
# "one free database per account" cap and the 30-day free-Postgres expiry:
#
#   * PostgreSQL : Neon      (neon.tech)      - free, no expiry, no card
#   * Redis      : Upstash   (upstash.com)    - free, no card   [optional]
#
# You paste both connection strings when Render prompts for the `sync: false`
# vars. See DEPLOYMENT.md. Redis is optional: without it the API still serves
# the full synchronous demo (seed + run-scenario); you just lose the reactive
# worker pipeline and live SSE updates.

services:
  - type: web
    name: nirikshan-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NIRIKSHAN_ENV
        value: production
      - key: NIRIKSHAN_LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NIRIKSHAN_SECRET_KEY
        generateValue: true                 # random, kept across deploys
      - key: NIRIKSHAN_DATABASE_URL
        sync: false                         # <-- paste the Neon connection string
      - key: NIRIKSHAN_REDIS_URL
        sync: false                         # <-- paste the Upstash URL, or leave blank
      - key: NIRIKSHAN_RUN_WORKER_IN_PROCESS
        value: "true"
      - key: NIRIKSHAN_LLM_PROVIDER
        value: mock                         # set "groq" + add NIRIKSHAN_LLM_API_KEY for real AI
      - key: NIRIKSHAN_LLM_API_KEY
        sync: false                         # optional; leave blank for the mock provider
      - key: NIRIKSHAN_REMEDIATION_MODE
        value: APPROVAL_REQUIRED
      - key: NIRIKSHAN_CORS_ORIGINS
        value: https://nirikshan-web.onrender.com
      - key: NIRIKSHAN_BOOTSTRAP_ADMIN_EMAIL
        value: admin@nirikshan.dev
      - key: NIRIKSHAN_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true                 # read it from this service's Environment tab
      - key: NIRIKSHAN_RETENTION_LOGS_HOURS
        value: "48"
      - key: NIRIKSHAN_RETENTION_METRICS_HOURS
        value: "96"

  - type: web
    name: nirikshan-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /login
    autoDeploy: false
    envVars:
      # Build arg: empty => the browser calls same-origin "/api/*".
      - key: NEXT_PUBLIC_API_BASE_URL
        value: ""
      # Runtime: where Next forwards "/api/*". This must match the API service's
      # real URL - Render appended "-u4hl" because the plain name was taken.
      # If you re-create the API and it gets a different suffix, update this.
      - key: API_INTERNAL_BASE_URL
        value: https://nirikshan-api-u4hl.onrender.com
