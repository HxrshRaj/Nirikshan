[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshan"
version = "0.1.0"
description = "Nirikshan - AI-Powered SRE & Incident Response Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harsh Raj" }]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "scikit-learn==1.6.0",
    "httpx==0.28.1",
    "PyJWT==2.13.0",
    "bcrypt==4.2.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "python-multipart==0.0.32",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
    "anyio==4.7.0",
    "fakeredis==2.26.2",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "pip-audit==2.7.3",
    "types-python-dateutil==2.9.0.20241206",
]

[project.scripts]
nirikshan-api = "nirikshan.api.__main__:main"
nirikshan-worker = "nirikshan.workers.__main__:main"
nirikshan-demo = "nirikshan.demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast isolated tests (no external services)",
    "integration: requires real PostgreSQL and/or Redis",
    "e2e: full-scenario pipeline tests",
    "ai_eval: AI evaluation-harness tests",
    "failure: fault-injection / resilience tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # starlette 1.x nags to switch the TestClient to httpx2; not worth a second http lib
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Focus on correctness-relevant rules; E501 (line length) is not enforced.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["B008", "RUF012", "B904", "C408", "UP038", "B017", "E702", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "B007", "E402"]
"migrations/**" = ["F401", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
