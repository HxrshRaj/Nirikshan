[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshan-sdk"
version = "0.1.0"
description = "Python SDK that captures errors and sends them to a Nirikshan server (stdlib only, async-safe)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harsh Raj" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.8.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
