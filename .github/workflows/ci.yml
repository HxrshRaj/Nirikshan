name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, type, tests, migrations, eval)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nirikshan
          POSTGRES_PASSWORD: nirikshan
          POSTGRES_DB: nirikshan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nirikshan" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      NIRIKSHAN_SECRET_KEY: ci-secret
      NIRIKSHAN_LLM_PROVIDER: mock
      NIRIKSHAN_TEST_DATABASE_URL: postgresql+psycopg://nirikshan:nirikshan@localhost:5432/nirikshan_test
      NIRIKSHAN_TEST_REDIS_URL: redis://localhost:6379/15
      NIRIKSHAN_DATABASE_URL: postgresql+psycopg://nirikshan:nirikshan@localhost:5432/nirikshan_test
      NIRIKSHAN_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]" pip-audit
      - name: Ruff
        run: ruff check src tests evaluation
      - name: Type check
        run: mypy src || true   # advisory: type coverage is partial by design
      - name: Alembic migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Unit / e2e / failure / ai-eval tests
        run: pytest -q -m "not integration" --cov=nirikshan --cov-report=term-missing
      - name: Integration tests (real Postgres + Redis)
        run: pytest -q -m integration
      - name: AI evaluation harness
        run: python evaluation/run_eval.py
      - name: Dependency audit
        run: pip-audit --strict --ignore-vuln GHSA-none || true

  frontend:
    name: Frontend (lint, type, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: nirikshan-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: nirikshan-web:ci

  e2e:
    name: Frontend E2E (Playwright against the compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Bring up the full stack
        run: docker compose up -d --build --wait api web worker
      - name: Seed demo data + one incident
        run: |
          TOK=$(curl -sf -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@nirikshan.dev","password":"admin12345"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST http://localhost:8000/api/demo/seed -H "Authorization: Bearer $TOK" >/dev/null
          curl -sf -X POST http://localhost:8000/api/demo/run-scenario -H "Authorization: Bearer $TOK" \
            -H 'Content-Type: application/json' \
            -d '{"scenario":"db-exhaustion","investigate":true,"propose_remediation":true}'
      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: apps/web
        run: npx playwright test
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
